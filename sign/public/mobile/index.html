<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8">
  <meta name="description" content="在手机上手写签名，实时飞入景区电子签名墙，生成专属海报。">
  <title>山水留痕 · 手机签名</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mobile/mobile.css">
</head>
<body>
  <div class="phone">
    <header class="m-head">
      <div class="m-brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M4 36c6-9 10-14 15-14s9 5 15 15" stroke="#f0d69c" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="33" cy="13" r="4" stroke="#f7f2e8" stroke-width="1.6" opacity=".8"/>
            <path d="M9 40c5-6 8-9 12-9 5 0 8 4 13 9" stroke="#e0b45c" stroke-width="1.4" opacity=".55" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1 id="m-title">山水留痕</h1>
          <p id="m-org">云栖山风景区</p>
        </div>
      </div>
      <div class="step-badge" id="step-badge">签名墙</div>
    </header>

    <main class="m-main">
      <!-- 1 首屏 -->
      <section class="step active" data-step="intro">
        <div class="hero">
          <div class="hero-kicker">SCAN · SIGN · SHARE</div>
          <h2>在山水之间<br>留下你的名字</h2>
          <p id="m-sub">落笔成景 · 把此刻留在山水之间</p>
          <div class="hero-stat">已有 <b id="m-count">0</b> 位游客上墙</div>
          <button class="cta" id="go-sign" type="button">开始签名</button>
          <p class="hint-small">签名会实时出现在现场大屏上<br>完成后还能生成专属海报</p>
        </div>
        <svg class="hero-scene" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true">
          <circle cx="316" cy="52" r="15" fill="rgba(224,180,92,0.22)" stroke="rgba(169,130,47,0.4)" stroke-width="1.6"/>
          <path d="M0 178 C 38 140 62 108 92 122 C 120 135 134 92 160 88 C 188 84 200 140 228 150 C 254 159 270 110 298 108 C 328 106 346 158 400 168 L400 220 L0 220Z" fill="rgba(18,40,63,0.1)"/>
          <path d="M0 197 C 50 172 72 188 104 174 C 136 160 154 182 188 178 C 222 174 240 192 276 184 C 312 176 344 194 400 188 L400 220 L0 220Z" fill="rgba(18,40,63,0.17)"/>
          <path d="M0 214 C 70 200 120 208 180 202 C 240 196 300 206 400 200 L400 220 L0 220Z" fill="rgba(18,40,63,0.24)"/>
        </svg>
      </section>

      <!-- 2 签名 -->
      <section class="step" data-step="sign">
        <div class="step-head"><span class="step-no">01</span><h2>手写签名</h2></div>
        <div class="pad-wrap">
          <canvas id="m-pad"></canvas>
          <div class="pad-guide" id="pad-guide">请在这里签名</div>
        </div>
        <div class="pad-tools">
          <div class="swatches" id="swatches"></div>
          <div class="widths" id="widths"></div>
          <div class="pad-actions">
            <button class="mini" id="pad-undo" type="button">撤销</button>
            <button class="mini" id="pad-clear" type="button">清空</button>
          </div>
        </div>
        <p class="hint-small">写得大一点，大屏上会更清晰</p>
        <div class="step-actions">
          <button class="ghost" id="sign-back" type="button">上一步</button>
          <button class="cta" id="sign-next" type="button">下一步</button>
        </div>
      </section>

      <!-- 3 拍照 -->
      <section class="step" data-step="photo">
        <div class="step-head"><span class="step-no">02</span><h2>拍照留影</h2><span class="optional">可选</span></div>
        <div class="photo-box">
          <video id="m-video" autoplay playsinline muted hidden></video>
          <img id="m-preview" alt="留影预览" hidden>
          <div class="photo-empty" id="photo-empty">
            <div class="icon">◎</div>
            <p>拍一张留影，合成到专属海报</p>
          </div>
        </div>
        <div class="photo-actions">
          <button class="ghost" id="photo-cam" type="button">打开相机</button>
          <button class="ghost" id="photo-file-btn" type="button">从相册选择</button>
          <button class="cta" id="photo-shot" type="button" hidden>拍照</button>
        </div>
        <input type="file" id="photo-file" accept="image/*" hidden>
        <div class="step-actions">
          <button class="ghost" id="photo-back" type="button">上一步</button>
          <button class="cta" id="photo-next" type="button">下一步</button>
        </div>
      </section>

      <!-- 4 昵称与留言 -->
      <section class="step" data-step="text">
        <div class="step-head"><span class="step-no">03</span><h2>留下你的话</h2></div>
        <label class="field">
          <span>昵称（可选）</span>
          <input id="m-name" maxlength="16" placeholder="怎么称呼你？" autocomplete="off">
        </label>
        <label class="field">
          <span>留言（可选）</span>
          <textarea id="m-msg" maxlength="80" rows="3" placeholder="想对这片山水说的一句话…"></textarea>
          <em id="m-msgcount">0/80</em>
        </label>
        <div class="chips" id="chips"></div>
        <div class="step-actions">
          <button class="ghost" id="text-back" type="button">上一步</button>
          <button class="cta" id="text-next" type="button">预览海报</button>
        </div>
      </section>

      <!-- 5 海报预览 -->
      <section class="step" data-step="preview">
        <div class="step-head"><span class="step-no">04</span><h2>确认上墙</h2></div>
        <div class="poster-wrap"><canvas id="poster"></canvas></div>
        <p class="hint-small">提交后签名会飞入大屏，并生成专属海报</p>
        <div class="step-actions">
          <button class="ghost" id="preview-back" type="button">修改</button>
          <button class="cta" id="preview-submit" type="button">提交上墙</button>
        </div>
      </section>

      <!-- 6 完成 -->
      <section class="step" data-step="done">
        <div class="done-mark">✓</div>
        <h2 id="done-title">已上墙</h2>
        <p id="done-text">你的签名已经出现在大屏上</p>
        <div class="poster-wrap small"><canvas id="poster-done"></canvas></div>
        <div class="step-actions column">
          <button class="cta" id="save-poster" type="button">保存海报到相册</button>
          <button class="ghost" id="share-poster" type="button">分享给朋友</button>
          <button class="ghost" id="again" type="button">再签一个</button>
        </div>
        <p class="hint-small" id="save-hint">iPhone 可长按海报保存到相册</p>
      </section>
    </main>

    <footer class="m-foot" id="m-foot">© 云栖山风景区 · 山水留痕电子签名墙</footer>
  </div>

  <div class="toast" id="m-toast" role="status" aria-live="polite"></div>
  <div id="boot-error" hidden></div>
  <script type="module" src="/mobile/mobile.js"></script>
</body>
</html>
