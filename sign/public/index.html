<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050d14">
  <title>山水留痕 · 电子签名墙</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/wall.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="stage" aria-label="签名墙"></canvas>

  <div class="hud">
    <header class="hud-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M4 36c6-9 10-14 15-14s9 5 15 15" stroke="#e0b45c" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
            <path d="M9 40c5-6 8-9 12-9 5 0 8 4 13 9" stroke="#e0b45c" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
            <circle cx="33" cy="12" r="4.2" stroke="#f2e3c0" stroke-width="1.8" opacity=".85"/>
            <path d="M12 18c3-4 6-4 9 0" stroke="#f2e3c0" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="event-title">山水留痕</h1>
          <p id="event-sub">落笔成景 · 把此刻留在山水之间</p>
        </div>
      </div>
      <div class="hud-meta">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="event-date">----</div>
        <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">连接中</span></div>
      </div>
    </header>

    <aside class="qr-card" id="qr-card">
      <div class="qr-frame"><canvas id="qr-canvas" width="240" height="240"></canvas></div>
      <div class="qr-text">
        <b>扫码签名</b>
        <span>手机手写 · 一秒上墙</span>
        <span class="qr-url" id="qr-url"></span>
      </div>
    </aside>

    <div class="ticker" id="ticker"><span id="ticker-text"></span></div>

    <div class="hint" id="hint"><span class="pulse"></span><span id="hint-text">触摸屏幕 · 写下你的名字</span></div>

    <div class="standby" id="standby">
      <div class="standby-inner">
        <div class="standby-kicker">WELCOME TO</div>
        <div class="standby-title" id="standby-title">山水留痕</div>
        <div class="standby-line"></div>
        <div class="standby-sub" id="standby-sub">落笔成景 · 把此刻留在山水之间</div>
        <button class="btn-primary" id="standby-cta" type="button">触摸唤醒 · 开始签名</button>
        <div class="standby-stat">已有 <b id="standby-count">0</b> 位游客留下足迹</div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <!-- 签名面板 -->
  <section class="panel" id="sign-panel" hidden aria-modal="true" role="dialog" aria-label="手写签名">
    <div class="panel-card sign-card">
      <div class="panel-head">
        <h2>落笔签到</h2>
        <button class="icon-btn" id="sign-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="sign-body">
        <div class="sign-left">
          <div class="paper">
            <canvas id="sign-canvas"></canvas>
            <div class="paper-guide" id="paper-guide">请在此处签名</div>
          </div>
          <div class="brush-row">
            <div class="swatches" id="swatches"></div>
            <div class="widths" id="widths"></div>
            <div class="sign-actions">
              <button class="btn-ghost" id="btn-undo" type="button">撤销</button>
              <button class="btn-ghost" id="btn-clear" type="button">清空</button>
            </div>
          </div>
        </div>
        <div class="sign-right">
          <label class="field">
            <span>昵称（可选）</span>
            <input id="sign-name" maxlength="16" placeholder="怎么称呼你？" autocomplete="off">
          </label>
          <label class="field">
            <span>留言（可选）</span>
            <textarea id="sign-msg" maxlength="80" rows="3" placeholder="想对山水说的一句话…"></textarea>
            <em id="msg-count">0/80</em>
          </label>
          <label class="check" id="photo-row">
            <input type="checkbox" id="sign-photo">
            <span>拍一张留影（合成海报 / 打印纪念）</span>
          </label>
          <div class="photo-preview" id="photo-preview" hidden>
            <img id="photo-img" alt="留影预览">
            <button class="btn-ghost" id="photo-retake" type="button">重拍</button>
          </div>
          <div class="sign-tip">签名仅用于本场活动留念，请文明用语。<br>落笔后点击「上墙」，你的签名会飞入这片山水。</div>
          <button class="btn-primary wide" id="sign-submit" type="button">落笔生花 · 上墙</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 相机 -->
  <section class="panel" id="camera-panel" hidden aria-modal="true" role="dialog" aria-label="拍照留影">
    <div class="panel-card camera-card">
      <div class="panel-head">
        <h2>留影</h2>
        <button class="icon-btn" id="camera-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="camera-stage"><video id="camera-video" autoplay playsinline muted></video></div>
      <div class="camera-actions">
        <button class="btn-ghost" id="camera-cancel" type="button">取消</button>
        <button class="btn-primary" id="camera-shot" type="button">拍下这一刻</button>
      </div>
    </div>
  </section>

  <!-- 签名详情 -->
  <section class="panel" id="detail-panel" hidden aria-modal="true" role="dialog" aria-label="签名详情">
    <div class="panel-card detail-card">
      <div class="panel-head">
        <h2 id="detail-name">—</h2>
        <button class="icon-btn" id="detail-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="detail-body">
        <div class="detail-photo-wrap" id="detail-photo-wrap" hidden><img id="detail-photo" alt="留影"></div>
        <div class="detail-sign"><img id="detail-sig" alt="签名"></div>
        <p class="detail-msg" id="detail-msg"></p>
        <div class="detail-meta" id="detail-meta"></div>
      </div>
      <div class="detail-actions">
        <button class="btn-ghost" id="detail-print" type="button">打印留念</button>
        <button class="btn-primary" id="detail-ok" type="button">继续浏览</button>
      </div>
    </div>
  </section>

  <div id="boot-error" hidden></div>
  <script type="module" src="/js/wall.js"></script>
</body>
</html>
