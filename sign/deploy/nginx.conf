# 山水留痕 · 电子签名墙 —— Nginx 反向代理配置
# 用法：替换 wall.example.com 为你的域名，放到 /etc/nginx/sites-available/signature-wall

# HTTP 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wall.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wall.example.com;

    ssl_certificate     /etc/letsencrypt/live/wall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wall.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 手机上传的签名 / 留影最大 12MB（与后端限制一致）
    client_max_body_size 12m;

    # 安全响应头（后端已带 CSP，这里补充 HSTS）
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket 升级（大屏 / 手机实时同步必须）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 可选：限制后台来源（按需取消注释并填写办公网段）
    # location /admin {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
